.publish-eo: &publish-eo
  name: 部署正式环境
  imports:
    - https://cnb.cool/linshi-2026/env/-/blob/main/tencent_edgeone.yml
  image: tencentcom/deploy-eopages:latest
  script: |
    set -eu
    rm -rf edgeone-deploy
    mkdir -p edgeone-deploy
    cp index.html edgeone-deploy/index.html
    edgeone makers deploy ./edgeone-deploy -n wavedrom-gui -t "$EO_SECRET"

# 仓库级 tag_push 事件必须放在 $ 兜底分支下。
"$":
  tag_push:
    - name: 发布并部署
      lock:
        key: wavedrom-gui-production-deploy
        wait: true
        cancel-in-wait: true
      stages:
        - name: 写入版本号
          image: node:20
          script: |
            set -eu
            node <<'NODE'
            const fs = require('fs');

            const tag = process.env.CNB_BRANCH;
            if (!/^v[0-9][0-9A-Za-z]*(?:[._-][0-9A-Za-z]+)*$/.test(tag || '')) {
              throw new Error(`Tag 格式无效：${tag || '(空)'}`);
            }

            const file = 'index.html';
            const marker = '<meta name="app-version" content="dev">';
            const html = fs.readFileSync(file, 'utf8');
            const matches = html.split(marker).length - 1;
            if (matches !== 1) {
              throw new Error(`预期找到 1 个开发版版本源，实际找到 ${matches} 个`);
            }

            const versionMeta = `<meta name="app-version" content="${tag}">`;
            const next = html.replace(marker, versionMeta);
            fs.writeFileSync(file, next, 'utf8');

            const saved = fs.readFileSync(file, 'utf8');
            if (!saved.includes(versionMeta) || saved.includes(marker)) {
              throw new Error('版本号写入后校验失败');
            }
            console.log(`已将应用版本号写入为 ${tag}`);
            NODE

        - <<: *publish-eo

        # 自动生成变动说明：汇总「上一个 Tag → 本次 Tag」之间的提交，写入 LATEST_CHANGELOG.md。
        # allowFailure：首个 Tag、区间内无变更或 Git 历史不可达时不阻断发版，由下一步兜底。
        # 不在此前执行 git fetch --unshallow：文末 git-sync 依赖 fetch_options: --unshallow，
        # 仓库一旦先变成完整库，该参数会报 "does not make sense"。
        - name: 生成变动说明
          image: cnbcool/changelog:latest
          allowFailure: true
          settings:
            latestChangeLogTarget: LATEST_CHANGELOG.md
            linkReferences: true
            showPr: true

        # 组装最终 Release 描述：固定文案 + 自动变动说明；文件缺失时降级，保证发布不被卡住。
        - name: 组装 Release 说明
          image: node:20
          script: |
            set -eu
            if [ -s LATEST_CHANGELOG.md ]; then
              echo "已获取自动生成的变动说明，共 $(wc -l < LATEST_CHANGELOG.md) 行"
              echo "----- LATEST_CHANGELOG.md 预览 -----"
              head -n 40 LATEST_CHANGELOG.md
            else
              echo "【警告】未生成 LATEST_CHANGELOG.md（首个 Tag / 区间无变更 / Git 历史不足），本次降级为固定说明"
            fi

            {
              echo "WaveDrom-Gui $CNB_BRANCH"
              echo
              echo "Web 可视化编辑器、wavedrom-render Skill、VS Code 扩展（.vsix）与 kodbox 插件（.zip）的版本发布。"
              echo
              if [ -s LATEST_CHANGELOG.md ]; then
                cat LATEST_CHANGELOG.md
              else
                echo "本次未生成自动变动说明，请查看提交记录。"
              fi
            } > RELEASE_NOTES.md

            test -s RELEASE_NOTES.md
            echo "----- RELEASE_NOTES.md（前 40 行）-----"
            head -n 40 RELEASE_NOTES.md

        - name: 创建 Release
          type: git:release
          options:
            tag: "$CNB_BRANCH"
            title: "$CNB_BRANCH"
            # 与 description 互斥：描述内容较多时用文件，避免超出长度限制
            descriptionFromFile: RELEASE_NOTES.md
            latest: true

        - name: 打包 VS Code 扩展
          image: node:20
          script: |
            set -eu
            # 必须排在「准备 Release 附件」之前：那一步会把 index.html 改名成
            # wavedrom-gui.html，而 scripts/build.js 要从 ../index.html 拷编辑器界面进
            # media/editor.html——改名之后再打包会 ENOENT（v260911.0 就是这么挂的）
            test -f index.html
            cd vscode
            # 干净检出（无 node_modules）即可打包：vsce 会执行 package.json 的
            # vscode:prepublish（即 scripts/build.js），而它零依赖
            npx --yes @vscode/vsce@3 package --out wavedrom-gui-vscode.vsix \
              --baseContentUrl https://cnb.cool/linshi-2026/wavedrom-gui/-/blob/main/vscode \
              --baseImagesUrl https://cnb.cool/linshi-2026/wavedrom-gui/-/raw/main/vscode
            test -s wavedrom-gui-vscode.vsix
            ls -l wavedrom-gui-vscode.vsix

        - name: 打包 kodbox 插件
          image: node:20
          script: |
            set -eu
            # 同样必须排在「准备 Release 附件」之前：kodbox/scripts/build.js 要从仓库根的
            # index.html 生成插件里的 static/app/editor.html，改名之后会 ENOENT。
            # zip 由 build.js 用 Node 自带 zlib 手写产出——node:20 镜像不保证有 zip/python3，
            # 这样两端流水线可以跑完全同一条命令。
            test -f index.html
            node kodbox/scripts/build.js --zip wavedrom-kodbox-plugin.zip
            test -s wavedrom-kodbox-plugin.zip
            ls -l wavedrom-kodbox-plugin.zip

        - name: 准备 Release 附件
          image: node:20
          script: |
            set -eu
            test -f index.html
            mv index.html wavedrom-gui.html
            test -f wavedrom-gui.html
            test ! -e index.html
            test -s wavedrom-kodbox-plugin.zip

        - name: 上传 Release 附件
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./wavedrom-gui.html"
              - "./vscode/wavedrom-gui-vscode.vsix"
              - "./wavedrom-kodbox-plugin.zip"

        # 把远端分支实体化成真正的本地分支，供下一步 git-sync 推送
        - name: 准备待同步的分支
          image: tencentcom/git-sync
          # 复用插件镜像：里面自带 git / git-lfs，无需额外拉基础镜像
          script: |
            set -eu
            git fetch origin '+refs/heads/*:refs/heads/*' --no-tags
            echo "本地分支："
            git for-each-ref --format='  %(refname:short) %(objectname:short)' refs/heads/

        # git-sync 只推送「本地已有的分支 ref」。tag_push 事件下 CNB 检出的是
        # detached HEAD，refs/heads/ 里一个分支都没有，此时插件打印
        # "Pushing all branches" 后必然走到 "No refs in common and none specified"，
        # 一个分支都推不过去（分支参数也一样：git rev-parse main 直接失败并 skip）。
        # 所以先在 `.git` 目录里把远端分支实体化成真正的本地分支，再交给插件推送。
        - name: sync to github
          image: tencentcom/git-sync
          imports:
            - https://cnb.cool/linshi-2026/env/-/blob/main/tencent_edgeone.yml
          settings:
            target_url: https://github.com/imysl0/wavedrom-gui.git
            auth_type: https
            username: $GIT_USERNAME
            password: $GIT_ACCESS_TOKEN
            # 只推 main，避免把 CI 自动生成的分支同步到 GitHub；
            # 有上面的本地分支后该参数才会生效（否则插件会 skip 并报 Warning）
            branch: main
            # 同步 tag
            push_tags: true
            # 关键参数：默认深度检出时的 .git 是 shallow 的，推到 GitHub 会报
            # "shallow update not allowed"，这里把仓库补全成完整历史
            fetch_options: --unshallow
