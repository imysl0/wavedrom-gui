# GitHub 侧只负责「打 tag 后构建 + 发布同名 Release」；代码由 CNB 流水线
# 同步过来（.cnb.yml 的 git-sync push_tags），这里不做部署、也不回写任何分支。
# 构建步骤与 .cnb.yml 的 tag_push 流水线保持一致：写入版本号 → 打包 VS Code
# 扩展 → 打包 kodbox 插件 → index.html 改名为 wavedrom-gui.html → 上传三个 Release 附件。
name: Release

on:
  push:
    # 与 CNB 侧 tag 格式校验（^v[0-9]...）对齐
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 完整历史 + 全部 tag：下面要定位「上一个 tag」并列出区间提交
          # （默认浅克隆只有 1 个提交、也没有 tag，生成不了变动说明）
          fetch-depth: 0

      - name: 使用 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 写入版本号
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const tag = process.env.TAG;
          if (!/^v[0-9][0-9A-Za-z]*(?:[._-][0-9A-Za-z]+)*$/.test(tag || '')) {
            throw new Error(`Tag 格式无效：${tag || '(空)'}`);
          }

          const file = 'index.html';
          const marker = '<meta name="app-version" content="dev">';
          const html = fs.readFileSync(file, 'utf8');
          const matches = html.split(marker).length - 1;
          if (matches !== 1) {
            throw new Error(`预期找到 1 个开发版版本源，实际找到 ${matches} 个`);
          }

          const versionMeta = `<meta name="app-version" content="${tag}">`;
          const next = html.replace(marker, versionMeta);
          fs.writeFileSync(file, next, 'utf8');

          const saved = fs.readFileSync(file, 'utf8');
          if (!saved.includes(versionMeta) || saved.includes(marker)) {
            throw new Error('版本号写入后校验失败');
          }
          console.log(`已将应用版本号写入为 ${tag}`);
          NODE

      - name: 生成变动说明
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 与 .cnb.yml 的「生成变动说明」同义：汇总「上一个 Tag → 本次 Tag」之间的提交。
          # CNB 侧用 cnbcool/changelog 插件；GitHub 侧直接用 git，避免多引一个 action。
          # 首个 Tag / 区间无变更 / 找不到上一个 Tag 时写空文件，由下一步降级为固定说明。
          : > LATEST_CHANGELOG.md

          prev="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)"
          if [ -z "$prev" ]; then
            echo "首个 Tag 或找不到上一个 Tag，跳过自动变动说明"
            exit 0
          fi
          echo "上一个 Tag：$prev"

          # --no-merges：合并提交不带要点；正文里保留提交主题（仓库的提交主题即改动要点）
          count="$(git rev-list --no-merges --count "${prev}..${TAG}")"
          if [ "$count" -eq 0 ]; then
            echo "区间 ${prev}..${TAG} 内没有提交"
            exit 0
          fi

          {
            echo "### 本次改动（共 ${count} 个提交）"
            echo
            git log --no-merges --pretty=format:'- %s' "${prev}..${TAG}"
            echo
          } > LATEST_CHANGELOG.md

          repo="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          echo >> LATEST_CHANGELOG.md
          echo "**完整对比**：${repo}/compare/${prev}...${TAG}" >> LATEST_CHANGELOG.md
          echo "----- LATEST_CHANGELOG.md 预览 -----"
          head -n 40 LATEST_CHANGELOG.md

      - name: 组装 Release 说明
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 固定文案 + 自动变动说明；文件缺失时降级，保证发布不被卡住（与 .cnb.yml 一致）
          if [ -s LATEST_CHANGELOG.md ]; then
            echo "已获取自动生成的变动说明，共 $(wc -l < LATEST_CHANGELOG.md) 行"
          else
            echo "【警告】未生成 LATEST_CHANGELOG.md（首个 Tag / 区间无变更 / Git 历史不足），本次降级为固定说明"
          fi

          {
            echo "WaveDrom-Gui ${TAG}"
            echo
            echo "Web 可视化编辑器、wavedrom-render Skill、VS Code 扩展（.vsix）与 kodbox 插件（.zip）的版本发布。"
            echo
            if [ -s LATEST_CHANGELOG.md ]; then
              cat LATEST_CHANGELOG.md
            else
              echo "本次未生成自动变动说明，请查看提交记录。"
            fi
          } > RELEASE_NOTES.md

          test -s RELEASE_NOTES.md
          echo "----- RELEASE_NOTES.md（前 40 行）-----"
          head -n 40 RELEASE_NOTES.md

      - name: 打包 VS Code 扩展
        run: |
          set -euo pipefail
          # 必须排在「index.html 改名」之前：scripts/build.js 会把仓库根的
          # index.html 拷进 media/editor.html，改名之后打包会 ENOENT
          # （CNB 侧 v260911.0 就是这么挂的）。干净检出即可打包：
          # vsce 执行的 vscode:prepublish（scripts/build.js）零依赖。
          test -f index.html
          cd vscode
          npx --yes @vscode/vsce@3 package --out wavedrom-gui-vscode.vsix \
            --baseContentUrl https://cnb.cool/linshi-2026/wavedrom-gui/-/blob/main/vscode \
            --baseImagesUrl https://cnb.cool/linshi-2026/wavedrom-gui/-/raw/main/vscode
          test -s wavedrom-gui-vscode.vsix

      - name: 打包 kodbox 插件
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 同样必须排在「index.html 改名」之前：kodbox/scripts/build.js 要从仓库根的
          # index.html 生成插件里的 static/app/editor.html。zip 由 build.js 用 Node 自带
          # zlib 手写产出，与 CNB 侧跑完全同一条命令（镜像里有没有 zip 都不影响）。
          # WDGUI_VERSION：插件版本跟着本次 tag 走，与 CNB 侧的 $CNB_BRANCH 同义。
          test -f index.html
          WDGUI_VERSION="$TAG" node kodbox/scripts/build.js --zip wavedrom-kodbox-plugin.zip
          test -s wavedrom-kodbox-plugin.zip

      - name: 准备 Release 附件
        run: |
          set -euo pipefail
          test -f index.html
          mv index.html wavedrom-gui.html
          test -f wavedrom-gui.html
          test -f vscode/wavedrom-gui-vscode.vsix
          test -s wavedrom-kodbox-plugin.zip

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -s RELEASE_NOTES.md
          files=(wavedrom-gui.html vscode/wavedrom-gui-vscode.vsix wavedrom-kodbox-plugin.zip)
          # 同名 Release 已存在时（流水线重跑/补附件）改为覆盖上传并同步刷新说明，避免重复创建报错
          if gh release view "$TAG" --json id >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "${files[@]}"
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" "${files[@]}" --title "$TAG" --notes-file RELEASE_NOTES.md --latest
          fi
