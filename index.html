<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WaveDrom 可视化编辑器</title>
<meta name="description" content="用鼠标点击编辑 WaveDrom 时序图，实时预览，单文件离线可用">
<style>
@import url('https://registry.npmmirror.com/lxgw-wenkai-webfont/latest/files/lxgwwenkaimono-regular.css');
@import url('https://registry.npmmirror.com/lxgw-wenkai-webfont/latest/files/lxgwwenkai-regular.css');
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root {
  --bg: #0B1220;
  --panel: #101A2E;
  --panel-2: #0D1526;
  --raise: #16223A;
  --line: #20304D;
  --line-soft: #182742;
  --text: #E8EEF9;
  --muted: #93A5C4;
  --faint: #5F7398;
  --acc: #34D399;
  --acc-text: #6EE7B7;
  --acc-ink: #052016;
  --amber: #FBBF24;
  --info: #38BDF8;
  --danger: #F87171;
  --ch1: #34D399; --ch2: #38BDF8; --ch3: #FBBF24;
  --ch4: #F472B6; --ch5: #A78BFA; --ch6: #FB7185;
  --sel: rgba(52, 211, 153, .28);
  --hover-veil: rgba(120, 150, 200, .14);
  --raise-hover: #1B2A46;
  --line-hover: #2C4269;
  --row-alt: rgba(16, 26, 46, .4);
  --head-hover: #14203A;
  --cell-hover: rgba(110, 231, 183, .1);
  --cell-hl: rgba(110, 231, 183, .06);
  --cell-paint: rgba(110, 231, 183, .14);
  --acc-veil: rgba(52, 211, 153, .12);
  --stage-bg: radial-gradient(ellipse 90% 60% at 50% -10%, rgba(56, 130, 246, .06), transparent), #0D1526;
  --code-text: #C9D8F0;
  --mask: rgba(4, 10, 22, .66);
  --warn-ink: #FBBF24;
  --warn-bg: rgba(251, 191, 36, .12);
  --warn-line: rgba(251, 191, 36, .3);
  --xbox: #94A3B8;
  --glyph-sample: #8FA5C4;
  --node-fill: #0B1220;
  --node-line: #6EE7B7;
  --danger-line: rgba(248, 113, 113, .4);
  --danger-veil: rgba(248, 113, 113, .12);
  color-scheme: dark;
  --font-ui: "LXGW WenKai Mono", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "LXGW WenKai Mono", "Cascadia Code", Consolas, "Noto Sans Mono CJK SC", monospace;
  --r-lg: 10px; --r-md: 8px; --r-sm: 6px;
  --shadow-pop: 0 14px 38px rgba(2, 8, 20, .55), 0 2px 8px rgba(2, 8, 20, .4);
}

/* ============ 浅色主题（工程图纸风） ============ */
html[data-theme="light"] {
  --bg: #EEF1F6;
  --panel: #FFFFFF;
  --panel-2: #F6F8FB;
  --raise: #EDF1F7;
  --line: #CBD5E4;
  --line-soft: #E2E8F2;
  --text: #1B2536;
  --muted: #54637F;
  --faint: #6E7D96;
  --acc: #0E9F6E;
  --acc-text: #0B7A55;
  --acc-ink: #032B1E;
  --amber: #B45309;
  --info: #0369A1;
  --danger: #DC2626;
  --ch1: #059669; --ch2: #0284C7; --ch3: #B45309;
  --ch4: #DB2777; --ch5: #7C3AED; --ch6: #E11D48;
  --sel: rgba(14, 159, 110, .22);
  --hover-veil: rgba(70, 100, 150, .1);
  --raise-hover: #E3E9F2;
  --line-hover: #B6C4D9;
  --row-alt: rgba(16, 26, 46, .035);
  --head-hover: #F0F4F9;
  --cell-hover: rgba(14, 159, 110, .1);
  --cell-hl: rgba(14, 159, 110, .05);
  --cell-paint: rgba(14, 159, 110, .16);
  --acc-veil: rgba(14, 159, 110, .12);
  --stage-bg: radial-gradient(ellipse 90% 60% at 50% -10%, rgba(59, 130, 246, .05), transparent), #F6F8FB;
  --code-text: #243247;
  --mask: rgba(20, 35, 60, .45);
  --warn-ink: #92610A;
  --warn-bg: rgba(180, 131, 9, .12);
  --warn-line: rgba(146, 97, 10, .35);
  --xbox: #64748B;
  --glyph-sample: #7484A0;
  --node-fill: #FFFFFF;
  --node-line: #0B7A55;
  --danger-line: rgba(220, 38, 38, .4);
  --danger-veil: rgba(220, 38, 38, .12);
  --shadow-pop: 0 14px 38px rgba(30, 50, 90, .18), 0 2px 8px rgba(30, 50, 90, .12);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.5 var(--font-ui);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
::selection { background: var(--sel); color: var(--text); }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; border-radius: 3px; }
* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; border: 2px solid var(--bg); }
*::-webkit-scrollbar-track { background: transparent; }
input, textarea, select, button { font: inherit; color: inherit; caret-color: var(--acc); }
button { cursor: pointer; }
svg { display: block; }

/* ============ 顶栏 ============ */
.topbar {
  flex: none;
  height: 52px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; margin-right: 10px; user-select: none; }
.brand .mark { color: var(--acc); filter: drop-shadow(0 0 5px color-mix(in srgb, var(--acc) 50%, transparent)); }
.brand .name { font-size: 14px; font-weight: 600; letter-spacing: -0.02em; }
.brand .name b { font-family: var(--font-mono); font-weight: 600; color: var(--acc-text); }
.brand .name span { color: var(--muted); font-weight: 500; }
.topbar .spacer { flex: 1; }

/* ============ 按钮 ============ */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 30px; padding: 0 11px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--raise);
  color: var(--text);
  transition: background .15s ease, border-color .15s ease;
  white-space: nowrap;
}
.btn:hover { background: var(--raise-hover); border-color: var(--line-hover); }
.btn.primary { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); font-weight: 600; }
.btn.primary:hover { background: var(--acc); border-color: var(--acc); filter: brightness(1.1); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--raise); color: var(--text); }
.btn.danger:hover { color: var(--danger); border-color: var(--danger-line); }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; flex: none;
  border: none; border-radius: var(--r-sm);
  background: transparent; color: var(--faint);
  transition: background .15s ease, color .15s ease;
}
.icon-btn:hover { background: rgba(120,150,200,.14); color: var(--text); }
.icon-btn.danger-hover:hover { color: var(--danger); background: var(--danger-veil); }

/* ============ 下拉菜单 ============ */
.menu-wrap { position: relative; }
.menu {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 90;
  min-width: 190px;
  background: var(--raise);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-pop);
  padding: 5px;
  display: none;
}
.menu.open { display: block; }
.menu.menu-right { left: auto; right: 0; }
.menu button {
  display: flex; align-items: center; gap: 9px; width: 100%;
  padding: 7px 10px; border: none; border-radius: var(--r-sm);
  background: transparent; color: var(--text); text-align: left;
  transition: background .12s ease;
}
.menu button:hover { background: rgba(120,150,200,.14); }
.menu button svg { color: var(--muted); flex: none; }
.menu button .kbd { margin-left: auto; font: 10px var(--font-mono); color: var(--faint); }
.menu button .check { margin-left: auto; color: var(--acc-bright); }
#m-font .menu { min-width: 258px; }
#m-font .menu button { white-space: nowrap; }
#m-font .menu button .kbd { margin-left: auto; }
#m-font .menu button .check { margin-left: 8px; }
.menu .sep { height: 1px; background: var(--line-soft); margin: 5px 4px; }

/* ============ 工作区 ============ */
.workspace { flex: 1; display: flex; min-height: 0; }

/* ---- 左侧栏 ---- */
.side {
  flex: none; width: 296px;
  background: var(--panel-2);
  border-right: 1px solid var(--line);
  overflow-y: auto;
  padding: 12px;
  display: flex; flex-direction: column; gap: 14px;
}
.side-section { background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--r-lg); }
.side-section > summary, .side-section > .sec-head {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 12px;
  font-size: 11.5px; font-weight: 600; letter-spacing: .05em;
  color: var(--muted);
  user-select: none;
}
.side-section > summary { cursor: pointer; list-style: none; }
.side-section > summary::-webkit-details-marker { display: none; }
.side-section > summary svg, .side-section > .sec-head svg { color: var(--faint); }
.side-section > summary .chev { margin-left: auto; transition: transform .15s ease; }
.side-section[open] > summary .chev { transform: rotate(90deg); }
.sec-body { padding: 2px 10px 10px; }

/* 结构树 */
.tree { display: flex; flex-direction: column; gap: 2px; }
.tree-row {
  display: flex; align-items: center; gap: 7px;
  height: 32px; padding: 0 6px;
  border-radius: var(--r-sm);
  color: var(--text);
}
.tree-row:hover { background: var(--raise); }
.tree-row .tw-color { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.tree-row .tw-name {
  flex: 1; min-width: 0;
  font: 500 12.5px var(--font-mono);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tree-row input.tw-name-input {
  flex: 1; min-width: 0;
  background: transparent; border: 1px solid transparent; border-radius: 4px;
  font: 500 12.5px var(--font-mono); color: var(--text);
  padding: 1px 4px;
}
.tree-row input.tw-name-input:hover { border-color: var(--line); }
.tree-row input.tw-name-input:focus { outline: none; border-color: var(--acc); background: var(--panel-2); }
.tree-row.group > .tw-name { font-family: var(--font-ui); font-weight: 600; }
.tree-row .tw-kind { font-size: 10px; color: var(--faint); flex: none; }
.tree-row .lane-actions { display: none; align-items: center; gap: 1px; flex: none; }
.tree-row:hover .lane-actions, .tree-row:focus-within .lane-actions { display: inline-flex; }
.tree-row .lane-actions .icon-btn { width: 22px; height: 22px; }
.tree-empty { color: var(--faint); font-size: 12px; padding: 10px 6px; }
.add-lane-btns {
  display: grid; gap: 6px; margin-top: 9px;
  grid-template-columns: repeat(auto-fit, minmax(78px, 1fr));
}
.add-lane-btns .btn { justify-content: center; padding: 0 6px; font-size: 12px; height: 28px; min-width: 0; white-space: nowrap; }

/* 输入控件 */
.field { display: flex; align-items: center; gap: 8px; margin: 7px 0; }
.field label { flex: none; width: 74px; color: var(--muted); font-size: 12px; }
.field input[type="text"], .field input[type="number"], .field select {
  flex: 1; min-width: 0; height: 28px;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r-sm);
  padding: 0 8px; color: var(--text);
  font-family: var(--font-mono); font-size: 12px;
}
.field input[type="text"] { font-family: var(--font-ui); }
.field input:focus, .field select:focus { outline: none; border-color: var(--acc); }
.field input[type="range"] { flex: 1; accent-color: var(--acc); height: auto; }
.field .val { font: 600 12px var(--font-mono); color: var(--acc-text); width: 24px; text-align: right; }
.field input[type="checkbox"] { accent-color: var(--acc); width: 14px; height: 14px; }
.cfg-group { font-size: 11px; font-weight: 600; color: var(--faint); letter-spacing: .04em; margin: 12px 0 2px; }
.cfg-group:first-child { margin-top: 2px; }

/* 箭头面板 */
.edge-list { display: flex; flex-direction: column; gap: 7px; }
.edge-row {
  background: var(--panel-2); border: 1px solid var(--line-soft);
  border-radius: var(--r-md); padding: 7px 8px;
  display: flex; flex-direction: column; gap: 6px;
}
.edge-row .edge-pick { display: flex; align-items: center; gap: 6px; }
.edge-row select {
  flex: 1; min-width: 0; height: 26px;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-sm);
  color: var(--text); font: 11.5px var(--font-mono); padding: 0 4px;
}
.edge-row select:focus { outline: none; border-color: var(--acc); }
.edge-row .edge-style-pick { display: flex; align-items: center; gap: 6px; }
.edge-row .edge-style-pick .preview { flex: none; color: var(--muted); }
.edge-row .edge-style-pick select { flex: 1; }
.edge-row input[type="text"] {
  height: 26px; background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--r-sm); color: var(--text); padding: 0 8px; font-size: 12px;
}
.edge-row input[type="text"]:focus { outline: none; border-color: var(--acc); }
.edge-row .del { align-self: flex-end; margin-top: -24px; }
.edge-hint { color: var(--faint); font-size: 12px; padding: 4px 2px; }

/* ---- 中间编辑器 ---- */
.main-col { flex: 1; min-width: 0; display: flex; }
.split { flex: none; position: relative; z-index: 6; background: transparent; transition: background .15s ease; }
.split.v { width: 6px; margin: 0 -3px; cursor: col-resize; }
.split.h { height: 6px; margin: -3px 0; cursor: row-resize; }
.split.main-split { width: 6px; margin: 0 -3px; cursor: col-resize; }
html[data-view="below"] .main-split { width: auto; height: 6px; margin: -3px 0; cursor: row-resize; }
.split:hover, .split.dragging { background: var(--acc-veil); }
body.col-resizing, body.row-resizing { user-select: none; }
body.col-resizing *, body.row-resizing * { cursor: inherit !important; }
body.col-resizing { cursor: col-resize; }
body.row-resizing { cursor: row-resize; }
.editor-col { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
html[data-view="below"] .main-col { flex-direction: column; }
html[data-view="below"] .editor-col { flex: 1 1 58%; min-height: 0; }
html[data-view="below"] .right-col { width: auto; flex: none; height: 42%; border-left: none; border-top: 1px solid var(--line); }
#viewBtn .ic-side { display: none; }
html[data-view="below"] #viewBtn .ic-stack { display: none; }
html[data-view="below"] #viewBtn .ic-side { display: block; }
.editor-toolbar {
  flex: none; display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line-soft);
}
.icon-btn:disabled { opacity: .32; pointer-events: none; }
.col-stepper { display: flex; gap: 4px; margin-left: 4px; }
.col-stepper .btn { padding: 0 9px; font-family: var(--font-mono); font-size: 12px; }
.editor-toolbar .hint { color: var(--faint); font-size: 11.5px; margin-left: auto; }
.editor-toolbar .hint b { color: var(--muted); font-weight: 600; }

.grid-scroll { flex: 1; overflow: auto; position: relative; }
.grid-inner { min-width: max-content; padding-bottom: 40px; position: relative; }
.mini-edges { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 2; }

.time-row {
  display: flex; position: sticky; top: 0; z-index: 5;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.time-corner {
  position: sticky; left: 0; z-index: 6;
  width: var(--namew, 196px); flex: none;
  background: var(--bg);
  border-right: 1px solid var(--line);
  display: flex; align-items: center; padding: 0 12px;
  font-size: 11px; color: var(--faint); letter-spacing: .04em;
  font-weight: 600;
}
.time-cells { position: relative; display: flex; }
.time-cell {
  width: 36px; flex: none; height: 26px;
  display: flex; align-items: center; justify-content: center;
  font: 500 10px var(--font-mono); color: var(--faint);
  border-left: 1px solid var(--line-soft);
}
.time-cell.tick { color: var(--acc-text); font-weight: 600; }

.strip { display: flex; }
.strip-corner { width: var(--namew, 196px); flex: none; }
.strip-text { flex: none; text-align: center; color: var(--muted); font: 600 12.5px var(--font-ui); padding: 5px 8px; white-space: nowrap; }
.foot-nums { border-top: 1px solid var(--line-soft); padding: 3px 0; }
.strip-cells { display: flex; }
.strip-num { width: 36px; flex: none; text-align: center; font: 500 10px var(--font-mono); color: var(--acc-text); }
.foot-text { border-top: 1px solid var(--line-soft); }
.head-strip { border-bottom: none; }

.lane-row.row-active .lane-head { background: var(--head-hover); box-shadow: inset 3px 0 0 var(--acc); }
.lane-row.row-active .lane-track { background: rgba(52, 211, 153, .06); }
#wv0 svg .lane-dim { opacity: .12; }
.pop-glyphs .pg.active { border-color: var(--acc); background: var(--acc-veil); box-shadow: inset 0 0 0 1px var(--acc); }
#morePop { width: 210px; padding: 6px; }
#morePop .menu-item {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 7px 9px; border: none; border-radius: var(--r-sm);
  background: transparent; color: var(--text); text-align: left;
  font-size: 12.5px;
}
#morePop .menu-item:hover { background: var(--hover-veil); }
#morePop .menu-item svg { color: var(--muted); flex: none; }
.pop-glyphs .pg.active .tlabel { color: var(--acc-text); }

.lane-row { display: flex; height: 48px; }
.lane-row:nth-child(odd) .lane-track { background: var(--row-alt); }
.lane-head {
  position: sticky; left: 0; z-index: 4;
  width: var(--namew, 196px); flex: none; height: 100%;
  background: var(--panel);
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line-soft);
  display: flex; align-items: center; gap: 7px;
  padding: 0 8px 0 12px;
}
.lane-row:hover .lane-head { background: var(--head-hover); }
.lane-head .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--ch); box-shadow: 0 0 4px var(--ch); }
.lane-head input.lane-name {
  flex: 1; min-width: 0;
  background: transparent; border: 1px solid transparent; border-radius: 4px;
  font: 500 12.5px var(--font-mono); color: var(--text);
  padding: 2px 5px;
}
.lane-head input.lane-name:hover { border-color: var(--line); }
.lane-head input.lane-name:focus { outline: none; border-color: var(--acc); background: var(--panel-2); }
.lane-head .lane-actions { display: none; gap: 0; flex: none; }
.lane-row:hover .lane-actions, .lane-row:focus-within .lane-actions { display: inline-flex; }
.lane-head .pp-badge {
  flex: none;
  font: 600 9.5px var(--font-mono);
  color: var(--warn-ink);
  background: var(--warn-bg);
  border: 1px solid var(--warn-line);
  border-radius: 4px;
  padding: 1px 4px;
  white-space: nowrap;
}
.lane-row.spacer-row { height: 34px; }
.lane-row.spacer-row .lane-head { background: var(--panel-2); }
.lane-row.spacer-row .lane-head .spacer-label { color: var(--faint); font-size: 11.5px; flex: 1; }
.lane-row.group-row { height: 38px; }
.lane-row.group-row .lane-head { background: var(--panel-2); }
.lane-row.group-row:hover .lane-head { background: var(--head-hover); }
.lane-head .gname {
  flex: 1; min-width: 0;
  background: transparent; border: 1px solid transparent; border-radius: 4px;
  font-weight: 700; font-size: 12.5px; color: var(--acc-text);
  padding: 2px 5px;
}
.lane-head .gname:hover { border-color: var(--line); }
.lane-head .gname:focus { outline: none; border-color: var(--acc); background: var(--panel-2); }
.lane-head .indent { display: inline-block; flex: none; }

.lane-track { position: relative; flex: none; border-bottom: 1px solid var(--line-soft); overflow: hidden; }
.lane-track svg.mini { position: absolute; left: 0; top: 0; pointer-events: none; }
.cell {
  position: absolute; top: 0; height: 100%;
  width: 36px;
  cursor: pointer;
  transition: background .12s ease;
}
.cell:hover { background: var(--cell-hover); }
.cell.col-hl { background: var(--cell-hl); }
.cell.painting { background: var(--cell-paint); }
.grid-empty {
  margin: 60px auto; max-width: 430px; text-align: center;
  color: var(--muted);
  border: 1px dashed var(--line); border-radius: var(--r-lg);
  padding: 36px 30px;
}
.grid-empty svg { margin: 0 auto 14px; color: var(--faint); }
.grid-empty h2 { margin: 0 0 6px; font-size: 15px; color: var(--text); }
.grid-empty p { margin: 0 0 18px; font-size: 12.5px; }
.grid-empty .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

/* ---- 笔刷栏 ---- */
.palette {
  flex: none;
  display: flex; align-items: center; gap: 4px;
  padding: 8px 12px;
  background: var(--panel);
  border-top: 1px solid var(--line);
  overflow-x: auto;
}
.palette .tool {
  flex: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  width: 46px; height: 46px;
  border: 1px solid var(--line-soft); border-radius: var(--r-md);
  background: var(--panel-2); color: var(--muted);
  transition: border-color .12s ease, background .12s ease;
}
.palette .tool:hover { border-color: var(--line-hover); background: var(--raise); }
.palette .tool.active { border-color: var(--acc); background: var(--acc-veil); color: var(--text); }
.palette .tool svg { pointer-events: none; }
.palette .tool .tlabel { font-size: 9px; color: var(--faint); pointer-events: none; white-space: nowrap; }
.palette .tool.active .tlabel { color: var(--acc-text); }
.palette .psep { flex: none; width: 1px; height: 34px; background: var(--line); margin: 0 5px; }
.palette .phint { flex: 1; min-width: 0; color: var(--faint); font-size: 11px; margin-left: 8px; line-height: 1.45; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palette .phint b { color: var(--muted); font-weight: 600; }

/* ---- 右侧 预览/代码 ---- */
.right-col {
  flex: none; width: 460px;
  border-left: 1px solid var(--line);
  background: var(--panel-2);
  display: flex; flex-direction: column; min-height: 0;
}
.right-tabs { flex: none; display: flex; align-items: center; gap: 4px; padding: 8px 10px 0; }
.right-tabs .tab {
  height: 32px; padding: 0 14px;
  border: none; border-radius: var(--r-md) var(--r-md) 0 0;
  background: transparent; color: var(--muted);
  font-weight: 600; font-size: 12.5px;
  border-bottom: 2px solid transparent;
}
.right-tabs .tab.active { color: var(--text); background: var(--panel); border-bottom-color: var(--acc); }
.right-tabs .rt-spacer { flex: 1; }
.right-toolbar { display: flex; align-items: center; gap: 4px; padding-bottom: 4px; }
.right-toolbar .zoom-label { font: 600 11px var(--font-mono); color: var(--muted); min-width: 42px; text-align: center; }
.pane { flex: 1; min-height: 0; display: none; }
.pane.active { display: flex; flex-direction: column; }
.preview-stage {
  flex: 1; overflow: auto; position: relative;
  background: var(--stage-bg);
  padding: 18px;
}
.zoom-wrap { transform-origin: 0 0; width: max-content; }
html[data-theme="dark"] #wv0 svg { filter: invert(0.91) hue-rotate(180deg) contrast(1.05); }
html:not([data-theme]) #wv0 svg { filter: invert(0.91) hue-rotate(180deg) contrast(1.05); }
#themeBtn .ic-moon { display: none; }
html[data-theme="light"] #themeBtn .ic-moon { display: block; }
html[data-theme="light"] #themeBtn .ic-sun { display: none; }
.code-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 8px; }
.code-wrap textarea {
  flex: 1; min-height: 0; resize: none;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md);
  color: var(--code-text);
  font: 12px/1.6 var(--font-mono);
  padding: 12px 14px;
  white-space: pre;
  overflow: auto;
  tab-size: 2;
}
.code-wrap textarea:focus { outline: none; border-color: var(--acc); }
.code-foot { display: flex; align-items: center; gap: 10px; }
.code-err { color: var(--danger); font-size: 12px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.code-ok { color: var(--faint); font-size: 11.5px; flex: 1; }

/* ============ 弹层 ============ */
.popover {
  position: fixed; z-index: 100;
  width: 272px;
  background: var(--raise);
  border: 1px solid var(--line-hover);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-pop);
  padding: 10px;
  display: none;
}
.popover.open { display: block; }
.popover .pop-title { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
.popover .pop-title .pos { font-family: var(--font-mono); color: var(--acc-text); }
.pop-glyphs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.pop-glyphs .pg {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  height: 40px;
  border: 1px solid var(--line); border-radius: var(--r-sm);
  background: var(--panel-2); color: var(--muted);
  transition: border-color .12s ease, background .12s ease;
}
.pop-glyphs .pg:hover { border-color: var(--acc); background: rgba(52,211,153,.1); }
.pop-glyphs .pg .tlabel { font-size: 9px; color: var(--faint); }
.pop-field { margin-top: 9px; }
.pop-field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.pop-field input {
  width: 100%; height: 28px;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r-sm);
  padding: 0 8px; color: var(--text); font-size: 12px;
}
.pop-field input:focus { outline: none; border-color: var(--acc); }
.pop-node {
  margin-top: 9px; display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--muted);
}
.pop-node .badge {
  width: 20px; height: 20px; border-radius: 50%; flex: none;
  background: var(--panel-2); border: 1.5px solid var(--acc);
  color: var(--acc-text); font: 600 11px var(--font-mono);
  display: inline-flex; align-items: center; justify-content: center;
}
.pop-colors { display: flex; gap: 6px; align-items: center; }
.pop-colors .swatch {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid var(--line); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  font: 700 10px var(--font-mono); color: var(--panel-2);
  transition: transform .12s ease;
}
.pop-colors .swatch:hover { transform: scale(1.15); }
.pop-colors .swatch.active { outline: 2px solid var(--acc); outline-offset: 1px; }
.pop-actions { display: flex; gap: 6px; margin-top: 10px; }
.pop-actions .btn { flex: 1; justify-content: center; height: 28px; font-size: 12px; }

/* 模态 */
.modal-mask {
  position: fixed; inset: 0; z-index: 120;
  background: var(--mask);
  display: none; align-items: center; justify-content: center;
}
.modal-mask.open { display: flex; }
.modal {
  width: min(620px, 92vw);
  background: var(--panel);
  border: 1px solid var(--line); border-radius: var(--r-lg);
  box-shadow: var(--shadow-pop);
  padding: 18px;
}
.modal h3 { margin: 0 0 6px; font-size: 14px; }
.modal p { margin: 0 0 12px; color: var(--muted); font-size: 12.5px; }
.modal textarea {
  width: 100%; height: 220px; resize: vertical;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r-md);
  color: var(--code-text); font: 12px/1.6 var(--font-mono); padding: 10px 12px;
}
.modal textarea:focus { outline: none; border-color: var(--acc); }
.modal .m-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.modal .m-err { color: var(--danger); font-size: 12px; margin-top: 8px; min-height: 16px; }

/* Toast */
.toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast {
  background: var(--raise); border: 1px solid var(--line-hover); border-radius: var(--r-md);
  box-shadow: var(--shadow-pop);
  color: var(--text); font-size: 12.5px;
  padding: 9px 16px;
  animation: toast-in .22s cubic-bezier(.16, 1, .3, 1);
}
.toast.err { border-color: var(--danger); }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

/* 迷你波形描边辉光（示波器荧光） */
.wtrace { filter: drop-shadow(0 0 1.2px currentColor); }
html[data-trace="glow"] .wtrace { filter: drop-shadow(0 0 2.5px currentColor); }
#traceBtn .ic-glow { display: none; }
html[data-trace="glow"] #traceBtn .ic-slim { display: none; }
html[data-trace="glow"] #traceBtn .ic-glow { display: block; }

/* 响应式 */
@media (max-width: 1360px) { .right-col { width: 400px; } .side { width: 270px; } }
@media (max-width: 1150px) {
  body { overflow: auto; }
  .workspace { flex-direction: column; overflow: visible; }
  .side { width: 100%; flex-direction: row; flex-wrap: wrap; overflow: visible; }
  .side-section { flex: 1 1 320px; }
  .main-col { flex-direction: column; flex: none; }
  .split { display: none; }
  .side { width: 100% !important; }
  .editor-col { flex: none; min-height: 62vh; }
  .right-col { flex: none; width: auto !important; height: auto !important; border-left: none; border-top: 1px solid var(--line); }
  .preview-stage { min-height: 320px; }
  .code-wrap textarea { min-height: 240px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

</style>

function laneCharPositions(lane) {
  const base = gridCellW() * (lane.period || 1);

    positions.push({ x, w });
    x += w;

function commitUndo() {
  const cur = JSON.stringify(buildJSON());
  if (cur === undoBase) return;
  const now = Date.now();
  if (commitTag && commitTag === lastCommitTag && now - lastCommitTime < 700) {
    // 连续同类小改动（涂抹/打字/拖滑块）合并为一步
  } else {
    undoStack.push(undoBase);
    if (undoStack.length > UNDO_MAX) undoStack.shift();
  }

  undoBase = cur;
  redoStack.length = 0;
  updateUndoButtons();
}
function updateUndoButtons() {

function tickLabels(val, len) {
  let L = [];
  let offset;
  if (val === null || val === undefined || val === '') return { L, offset: 0 };
  if (typeof val === 'number') {
    offset = val;
    for (let i = 0; i < len; i++) L.push(i + offset);
    return { L, offset };
  }
  let arr = val;
  if (typeof val === 'string') arr = val.trim().split(/\s+/);
  if (!Array.isArray(arr) || arr.length === 0) return { L, offset: 0 };
  if (arr.length === 1) {
    const off = Number(arr[0]);
    if (isNaN(off)) { L = arr; }
    else { offset = off; for (let i = 0; i < len; i++) L.push(i + off); }
  } else if (arr.length === 2) {
    const s0 = Number(arr[0]), st = Number(arr[1]);
    const dp = (String(arr[1]).split('.')[1] || '').length;
    if (isNaN(s0) || isNaN(st)) { L = arr; }

/* 智能格式化：短数组和全基本类型的短对象保持单行，其余展开 */
function fmtJSON(v, ind = 0) {

  const flatObj = o => '{ ' + Object.keys(o).map(k => JSON.stringify(k) + ': ' + JSON.stringify(o[k])).join(', ') + ' }';
  const allFlat = o => Array.isArray(o) ? o.every(x => x === null || typeof x !== 'object' || (Array.isArray(x) && x.every(y => y === null || typeof y !== 'object'))) : Object.values(o).every(x => x === null || typeof x !== 'object');
  if (v === null || typeof v !== 'object') return JSON.stringify(v);
  if (Array.isArray(v)) {

    if (allFlat(v)) { const s = flatArr(v); if (s.length <= budget) return s; }
    return '[\n' + v.map(x => pad2 + fmtJSON(x, ind + 1)).join(',\n') + '\n' + pad + ']';
  }
  const keys = Object.keys(v);

  if (allFlat(v)) { const s = flatObj(v); if (s.length <= budget) return s; }
  return '{\n' + keys.map(k => pad2 + JSON.stringify(k) + ': ' + fmtJSON(v[k], ind + 1)).join(',\n') + '\n' + pad + '}';

/* 网格事件委托 */
function bindGrid() {
  const inner = $('#gridInner');
  let downPos = null;
  inner.addEventListener('mousedown', ev => {
    const cell = ev.target.closest('.cell');
    if (!cell || ev.button !== 0) return;
    downPos = [ev.clientX, ev.clientY];
    paintedSinceDown = false;
    if (state.tool.type === 'glyph') {
      const lane = getLaneById(+cell.dataset.lane);
      if (lane) { paintCell(lane, +cell.dataset.t, state.tool.char); painting = true; paintLane = lane.id; dragLastT = +cell.dataset.t; ev.preventDefault(); }
    } else if (state.tool.type === 'erase') {
      const lane = getLaneById(+cell.dataset.lane);
      if (lane) { clearCell(lane, +cell.dataset.t); paintedSinceDown = true; ev.preventDefault(); }
    } else if (state.tool.type === 'select') {
      const lane = getLaneById(+cell.dataset.lane);
      const s = lane && lane.slots[+cell.dataset.t];
      if (lane && s && s.glyph !== '.') {
        painting = true; paintLane = lane.id; dragLastT = +cell.dataset.t; extendMode = true;
      }
    }
  });
  inner.addEventListener('mouseover', ev => {
    const cell = ev.target.closest('.cell');
    document.querySelectorAll('.col-hl').forEach(x => x.classList.remove('col-hl'));
    if (cell) {
      const t = cell.dataset.t;
      document.querySelectorAll(`.cell[data-t="${t}"],.time-cell[data-t="${t}"]`).forEach(x => x.classList.add('col-hl'));
      if (painting && cell.dataset.lane == paintLane && (ev.buttons & 1)) {
        const lane = getLaneById(+cell.dataset.lane);
        const t = +cell.dataset.t;
        if (extendMode) {
          if (t === dragLastT + 1) {
            dragLastT = t;
            const cur = lane.slots[t];
            if (!cur || cur.glyph !== '.') paintCell(lane, t, '.');
          }
        } else if (state.tool.type === 'glyph') {
          let g = state.tool.char;
          if (g === '=' && t === dragLastT + 1) g = '.';
          const cur = lane.slots[t];
          const same = g === '.' ? (cur && cur.glyph === '.') : (cur && cur.glyph === g);
          dragLastT = t;
          if (!same) paintCell(lane, t, g);
        }
      }
    }
  });
  window.addEventListener('mouseup', () => { painting = false; paintLane = null; extendMode = false; });
  inner.addEventListener('mouseleave', () => document.querySelectorAll('.col-hl').forEach(x => x.classList.remove('col-hl')));
  inner.addEventListener('click', ev => {
    const cell = ev.target.closest('.cell');
    if (!cell) return;
    if (state.tool.type !== 'select') return;
    if (paintedSinceDown) return;
    const moved = downPos && Math.hypot(ev.clientX - downPos[0], ev.clientY - downPos[1]) > 4;
    if (moved) return;
    const lane = getLaneById(+cell.dataset.lane);
    if (lane) openPop(lane, +cell.dataset.t, cell);
  });
  inner.addEventListener('contextmenu', ev => {
    const cell = ev.target.closest('.cell');
    if (!cell) return;
    ev.preventDefault();
    const lane = getLaneById(+cell.dataset.lane);
    if (lane) clearCell(lane, +cell.dataset.t);
  });
  inner.addEventListener('keydown', ev => { if (ev.key === 'Escape') closePop(); });
  $('#previewStage').addEventListener('keydown', ev => { if (ev.key === 'Escape') closePop(); });
  document.addEventListener('mousedown', ev => {
    const pop = $('#cellPop');
    if (pop.classList.contains('open') && !pop.contains(ev.target) && !ev.target.closest('.cell')) closePop();
    const mp = $('#morePop');
    if (mp.classList.contains('open') && !mp.contains(ev.target) && !ev.target.closest('button[title="更多操作"]')) closeMoreMenu();
  });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape') { closePop(); closeMenus(); } });
}

/* ---------- 交互：结构操作 ---------- */
function moveNode(node, dir) {
  const loc = findLoc(node.id);
  if (!loc) return;
  const ni = loc.index + dir;
  if (ni < 0 || ni >= loc.list.length) { toast(dir < 0 ? '已经在最上了' : '已经在最下了'); return; }
  loc.list.splice(loc.index, 1);
  loc.list.splice(ni, 0, node);
  update(true);
}
function dupLane(lane) {
  const loc = findLoc(lane.id);
  const copy = newLane(lane.name + '_copy', lane.slots.map(s => s ? { glyph: s.glyph, label: s.label } : null));
  copy.period = lane.period; copy.phase = lane.phase; copy.len = lane.len;
  loc.list.splice(loc.index + 1, 0, copy);
  animateLanes = new Set([copy.id]);
  update(true);
  toast('已复制（节点标记不复制，避免字母冲突）');
}
function intoGroup(node) {
  const loc = findLoc(node.id);
  let target = null;
  for (let i = loc.index - 1; i >= 0; i--) {
    if (loc.list[i].kind === 'group') { target = loc.list[i]; break; }
  }
  if (!target) { toast('上方没有分组'); return; }
  loc.list.splice(loc.index, 1);
  target.children.push(node);
  update(true);
}
function outOfGroup(node) {
  const loc = findLoc(node.id);
  if (!loc.parent) { toast('这条通道不在任何分组里'); return; }
  loc.parent.children.splice(loc.index, 1);
  const gpLoc = findLoc(loc.parent.id);
  gpLoc.list.splice(gpLoc.index + 1, 0, node);
  update(true);
}
function delNode(node) {
  const loc = findLoc(node.id);
  if (!loc) return;
  if (node.kind === 'group') {
    if (node.children.length) {
      node.children.forEach((c, i) => loc.list.splice(loc.index + i, 0, c));
      toast('分组已删除，组内成员上移保留');
    }
    loc.list.splice(loc.list.indexOf(node), 1);
  } else {
    loc.list.splice(loc.index, 1);
    // 清理引用此通道节点的箭头
    const dead = new Set(Object.values(node.nodeByT || {}));
    state.edges = state.edges.filter(e => !dead.has(e.from) && !dead.has(e.to));
  }
  update(true);
}
function addLane(type) {
  const n = allLanes().length;
  const lane = newLane(type === 'clock' ? 'clk' : type === 'bus' ? 'bus' : 'signal_' + n);
  if (type === 'clock') { for (let i = 0; i < 8; i++) lane.slots.push({ glyph: 'p' }); }
  state.tree.push(lane);
  animateLanes = new Set([lane.id]);
  update(true);
  animateLanes = null;
  if (type === 'clock') toast('时钟通道已添加，已预填 8 拍');
}

function download(name, blob) {

  a.href = URL.createObjectURL(blob);

function getExportSvg() {
  const svg = $('#wv0 svg');
  if (!svg) { toast('预览还没有内容', true); return null; }
  const clone = svg.cloneNode(true);
  clone.removeAttribute('style');
  const vb = (svg.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number);
  const bbox = svg.getBoundingClientRect();
  const w = vb.length === 4 && vb[2] ? vb[2] : Math.round(bbox.width / state.zoom);
  const hgt = vb.length === 4 && vb[3] ? vb[3] : Math.round(bbox.height / state.zoom);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  clone.setAttribute('width', w); clone.setAttribute('height', hgt);
  return { str: new XMLSerializer().serializeToString(clone), w, h: hgt };
}

/* ---------- 动作分发 ---------- */
function handleAct(act, btn) {
  switch (act) {
    case 'add-bit': addLane('bit'); break;
    case 'add-clock': addLane('clock'); break;
    case 'add-bus': addLane('bus'); break;
    case 'add-spacer': state.tree.push({ kind: 'spacer', id: nextId() }); update(true); break;
    case 'add-group': {
      const g = newGroup('分组 ' + (state.tree.filter(n => n.kind === 'group').length + 1));
      state.tree.push(g);
      update(true);
      toast('分组已添加，用通道按钮里的「移入分组」收纳通道');
      break;
    }
    case 'add-col': {
      const n = +(btn && btn.dataset ? btn.dataset.n : 4) || 4;
      const cur = computeCols();
      localStorage.setItem('wdgui-cols-min', String(Math.max(0, cur + n)));
      renderGrid();
      break;
    }
    case 'add-edge': {
      const nodes = collectNodes();
      if (nodes.length < 2) { toast('至少需要两个节点标记，先在单元格里放置节点', true); return; }
      const used = new Set(state.edges.map(e => e.from + e.spec + e.to));
      let from = nodes[0].letter, to = nodes[1].letter;
      outer: for (const a of nodes) for (const b of nodes) {
        if (a !== b && !used.has(a.letter + '->' + b.letter)) { from = a.letter; to = b.letter; break outer; }
      }
      state.edges.push({ from, to, spec: '->', label: '' });
      update(true);
      document.querySelector('.side details:nth-of-type(2)').open = true;
      break;
    }
    case 'apply-code': {
      try {
        const j = JSON.parse($('#codeArea').value);
        applyDocJSON(j);
        $('#codeArea').blur();
        renderCode();
        toast('代码已应用到图表');
      } catch (e) {
        const st = $('#codeStatus');
        st.className = 'code-err'; st.textContent = 'JSON 解析失败：' + e.message;
      }
      break;
    }
    case 'import-file': $('#fileInput').click(); break;
    case 'import-paste':
      $('#pasteMask').classList.add('open');
      $('#pasteErr').textContent = '';
      setTimeout(() => $('#pasteArea').focus(), 30);
      break;
    case 'paste-cancel': $('#pasteMask').classList.remove('open'); break;
    case 'paste-ok': {
      try {
        const j = JSON.parse($('#pasteArea').value);
        applyDocJSON(j);
        $('#pasteMask').classList.remove('open');
        $('#pasteArea').value = '';
        toast('导入成功');
      } catch (e) { $('#pasteErr').textContent = '解析失败：' + e.message; }
      break;
    }
    case 'open-tutorial': window.open('https://wavedrom.com/tutorial.html', '_blank'); break;
    case 'export-svg': {
      const ex = getExportSvg(); if (!ex) return;
      download('wavedrom.svg', new Blob([ex.str], { type: 'image/svg+xml' }));
      break;
    }
    case 'export-png': {
      const ex = getExportSvg(); if (!ex) return;
      const img = new Image();
      const url = URL.createObjectURL(new Blob([ex.str], { type: 'image/svg+xml' }));
      img.onload = () => {
        const cv = document.createElement('canvas');
        cv.width = ex.w * 2; cv.height = ex.h * 2;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.drawImage(img, 0, 0, cv.width, cv.height);
        cv.toBlob(b => { if (b) download('wavedrom.png', b); else toast('PNG 生成失败', true); }, 'image/png');
        URL.revokeObjectURL(url);
      };
      img.onerror = () => { toast('PNG 生成失败', true); URL.revokeObjectURL(url); };
      img.src = url;
      break;
    }
    case 'export-json': download('wavedrom.json', new Blob([fmtJSON(buildJSON())], { type: 'application/json' })); break;
    case 'copy-json': copyText(fmtJSON(buildJSON()), 'JSON 已复制到剪贴板'); break;
    case 'copy-kroki': {
      const block = '```kroki\n' + JSON.stringify(buildJSON()) + '\n```';
      copyText(block, 'kroki 代码块已复制 —— 粘贴到支持 kroki 的 Markdown 即可渲染');
      break;
    }
    case 'copy-link': {
      persist();
      copyText(location.href, '分享链接已复制（含完整图表数据）');
      break;
    }
    case 'zoom-in': state.zoom = Math.min(3, state.zoom + 0.15); applyZoom(); break;
    case 'zoom-out': state.zoom = Math.max(0.4, state.zoom - 0.15); applyZoom(); break;
    case 'zoom-fit': state.zoom = 1; applyZoom(); break;
  }
}
function applyZoom() {
  $('#zoomWrap').style.transform = `scale(${state.zoom})`;
  $('#zoomLabel').textContent = Math.round(state.zoom * 100) + '%';
}

      $('.right-col').style.width = w + 'px'; state.sizes.right = w;
    } else {
      const maxH = $('.main-col').getBoundingClientRect().height - 220;
      const h = clamp(drag.size - (ev.clientY - drag.start), 160, Math.max(240, maxH));
      $('.right-col').style.height = h + 'px'; state.sizes.mainH = h;
    }
  });
  window.addEventListener('mouseup', () => {
    if (!drag) return;
    drag = null;
    document.body.classList.remove('col-resizing', 'row-resizing');
    splitSide.classList.remove('dragging'); splitMain.classList.remove('dragging');
    saveSizes();
    state.autoFit = true; renderPreview();
  });
  splitSide.addEventListener('dblclick', () => { $('.side').style.width = ''; delete state.sizes.side; saveSizes(); });
  splitMain.addEventListener('dblclick', () => { $('.right-col').style.width = ''; $('.right-col').style.height = ''; delete state.sizes.right; delete state.sizes.mainH; saveSizes(); state.autoFit = true; renderPreview(); });
}

/* ---------- 主题切换 ---------- */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  localStorage.setItem('wdgui-theme', t);
  renderGrid(); renderTree(); renderEdges(); buildPalette(); renderPreview();
}

/* ---------- 启动 ---------- */
function init() {
  let restored = false;
  if (location.hash.length > 1) {
    try { adoptState(parseDoc(JSON.parse(decodeURIComponent(location.hash.slice(1))))); restored = true; } catch (e) { /* 忽略坏链接 */ }
  }
  if (!restored) {
    const saved = localStorage.getItem('wdgui-doc-v1');
    if (saved) { try { adoptState(parseDoc(JSON.parse(saved))); restored = true; } catch (e) { /* 忽略 */ } }
  }
  if (!restored) adoptState(parseDoc(JSON.parse(JSON.stringify(EXAMPLES[1].json))));

  $('#traceBtn').addEventListener('click', () => {
    const t = document.documentElement.dataset.trace === 'glow' ? 'slim' : 'glow';
    document.documentElement.dataset.trace = t;
    localStorage.setItem('wdgui-trace', t);
    $('#traceBtn').title = t === 'glow' ? '轨迹样式：荧光辉光（点击切换为纤细）' : '轨迹样式：纤细（点击切换为荧光辉光）';
    renderGrid();
  });

  $('#viewBtn').addEventListener('click', () => {
    const v = document.documentElement.dataset.view === 'below' ? 'side' : 'below';
    document.documentElement.dataset.view = v;
    localStorage.setItem('wdgui-view', v);
    $('#viewBtn').title = v === 'below' ? '切换视图：预览放右侧' : '切换视图：预览放编辑区下方';
    applySizes();
    state.autoFit = true;
    renderPreview();
  });
  try { state.sizes = JSON.parse(localStorage.getItem('wdgui-splits')) || {}; } catch (e) { state.sizes = {}; }
  if (state.sizes.side) $('.side').style.width = state.sizes.side + 'px';
  applySizes();
  bindSplitters();

  undoBase = JSON.stringify(buildJSON());
  $('#undoBtn').addEventListener('click', doUndo);
  $('#redoBtn').addEventListener('click', doRedo);
  document.addEventListener('keydown', ev => {
    if (!(ev.ctrlKey || ev.metaKey) || ev.altKey) return;
    if (ev.key === 'z' || ev.key === 'Z') { ev.preventDefault(); ev.shiftKey ? doRedo() : doUndo(); }
    else if (ev.key === 'y' || ev.key === 'Y') { ev.preventDefault(); doRedo(); }
  });
  updateUndoButtons();

  $('#themeBtn').addEventListener('click', () => {
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  });

  buildPalette();
  bindMenus();
  bindGrid();
  bindSettings();

  document.querySelectorAll('[data-act]').forEach(b => {
    if (b.closest('.menu')) return;
    b.addEventListener('click', () => handleAct(b.dataset.act, b));
  });
  document.querySelectorAll('.right-tabs .tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.right-tabs .tab').forEach(x => x.classList.toggle('active', x === t));
    document.querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + t.dataset.tab));
    if (t.dataset.tab === 'preview') renderPreview();
  }));
  $('#fileInput').addEventListener('change', ev => {
    const f = ev.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try { applyDocJSON(JSON.parse(rd.result)); toast('已导入 ' + f.name); }
      catch (e) { toast('文件解析失败：' + e.message, true); }
    };
    rd.readAsText(f);
    ev.target.value = '';
  });
  $('#pasteMask').addEventListener('mousedown', ev => { if (ev.target === $('#pasteMask')) handleAct('paste-cancel'); });
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && $('#pasteMask').classList.contains('open') && (ev.ctrlKey || ev.metaKey)) handleAct('paste-ok');
  });

  syncSettings();
  renderTree();
  renderEdges();
  renderGrid();
  renderCode();
  renderPreview();
  animateLanes = new Set(allLanes().map(l => l.id));
  renderGrid();
  animateLanes = null;
}
document.addEventListener('DOMContentLoaded', init);

</script>
</body>
</html>
